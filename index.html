<!DOCTYPE html>
<html lang="vi">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Test WebAR Big Buck Bunny</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
    #overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    #start-btn {
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h2 id="status-text">Sẵn sàng trải nghiệm AR</h2>
    <button id="start-btn">Bắt đầu quét</button>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorCorrection: true, pictureInPicture: true" 
    embedded 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video 
        id="ar-video" 
        src="https://raw.githubusercontent.com/chthomos/video-media-samples/master/big-buck-bunny-480p-30sec.mp4" 
        preload="auto" 
        loop 
        crossorigin="anonymous" 
        webkit-playsinline 
        playsinline 
        muted>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
      <a-video 
        src="#ar-video" 
        width="1" 
        height="0.6" 
        position="0 0 0.05" 
        rotation="0 0 0"
        material="shader: flat; src: #ar-video;">
      </a-video>
    </a-entity>

  </a-scene>

  <script>
    const targetEntity = document.querySelector('#target-entity');
    const video = document.querySelector('#ar-video');
    const overlay = document.querySelector('#overlay');
    const statusText = document.querySelector('#status-text');
    const startBtn = document.querySelector('#start-btn');
    const aVideo = document.querySelector('a-video');

    startBtn.addEventListener('click', () => {
      statusText.innerText = "Đang tải dữ liệu...";
      video.play().then(() => {
        video.pause();
        startBtn.style.display = 'none';
        statusText.innerText = 'Hướng camera về phía trang báo...';
        overlay.style.pointerEvents = 'none';
      });
    });

    targetEntity.addEventListener("targetFound", () => {
      overlay.style.display = "none";
      video.muted = false;
      video.play();

      setTimeout(() => {
        if (aVideo.components.material && aVideo.components.material.material.map) {
          aVideo.components.material.material.map.needsUpdate = true;
        }
      }, 200);
    });

    targetEntity.addEventListener("targetLost", () => {
      overlay.style.display = "flex";
      statusText.innerText = 'Hướng camera về phía trang báo...';
      video.pause();
    });
  </script>

</body>
</html>
