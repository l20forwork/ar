<!DOCTYPE html>
<html lang="vi">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta charset="UTF-8">
  <title>iOS WebAR Fix</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    /* Sửa lỗi khoảng trắng: Ép toàn bộ ứng dụng tràn màn hình */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }

    a-scene {
      width: 100vw !important;
      height: 100vh !important;
      position: absolute !important;
      top: 0;
      left: 0;
    }

    #overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #start-btn {
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      background-color: #0275d8;
      color: white;
      border: none;
      border-radius: 12px;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h2 id="status-text">Sẵn sàng trải nghiệm AR</h2>
    <p>Chạm để kích hoạt Camera & Video</p>
    <button id="start-btn">Bắt đầu quét</button>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorCorrection: true; pictureInPicture: true" 
    embedded 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
      <!-- Dùng a-video chuẩn nhưng bổ sung xử lý RAF JS để không bị đơ hình -->
      <a-video 
        id="ar-video-node"
        src="#ar-video" 
        width="1" 
        height="0.65" 
        position="0 0 0.02" 
        rotation="0 0 0">
      </a-video>
    </a-entity>

    <a-assets>
      <video 
        id="ar-video" 
        src="./vtin.mp4" 
        preload="auto" 
        loop 
        crossorigin="anonymous" 
        webkit-playsinline 
        playsinline 
        muted>
      </video>
    </a-assets>

  </a-scene>

  <script>
    const targetEntity = document.querySelector('#target-entity');
    const video = document.querySelector('#ar-video');
    const overlay = document.querySelector('#overlay');
    const statusText = document.querySelector('#status-text');
    const startBtn = document.querySelector('#start-btn');
    const aVideoNode = document.querySelector('#ar-video-node');

    startBtn.addEventListener('click', () => {
      statusText.innerText = "Đang mở camera...";
      
      // Kích hoạt video bằng event handler chạm của người dùng
      video.play().then(() => {
        video.pause();
        startBtn.style.display = 'none';
        statusText.innerText = 'Hướng camera về phía tờ lịch/báo...';
        overlay.style.pointerEvents = 'none';
      }).catch(err => {
        alert("Lỗi cấp quyền: " + err.message);
      });
    });

    // Ép render từng khung hình (Fix lỗi có tiếng không có hình trên iOS Chrome)
    function renderFrame() {
      if (!video.paused && !video.ended) {
        if (aVideoNode.components.material && aVideoNode.components.material.material.map) {
          aVideoNode.components.material.material.map.needsUpdate = true;
        }
        requestAnimationFrame(renderFrame);
      }
    }

    targetEntity.addEventListener("targetFound", () => {
      overlay.style.display = "none";
      video.muted = false;
      video.play().then(() => {
        renderFrame(); // Chạy vòng lặp vẽ lại khung hình
      });
    });

    targetEntity.addEventListener("targetLost", () => {
      overlay.style.display = "flex";
      statusText.innerText = 'Hướng camera về phía tờ lịch/báo...';
      video.pause();
    });
  </script>

</body>
</html>
