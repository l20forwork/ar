<!DOCTYPE html>
<lang="vi">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <title>Báo in WebAR Experience</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
    
    /* Overlay bắt đầu & quét */
    #overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 999;
      font-family: sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    #start-btn {
      padding: 12px 24px;
      font-size: 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      margin-top: 15px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h2 id="status-text">Nhấn nút bên dưới để khởi chạy AR</h2>
    <button id="start-btn">Bắt đầu quét</button>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorCorrection: true, pictureInPicture: true" 
    embedded 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video id="ar-video" src="./video-bao.mp4" preload="auto" loop crossorigin="anonymous" webkit-playsinline playsinline muted></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
      <a-video src="#ar-video" width="1" height="0.6" position="0 0 0" rotation="0 0 0"></a-video>
    </a-entity>

  </a-scene>

  <script>
    const targetEntity = document.querySelector('#target-entity');
    const video = document.querySelector('#ar-video');
    const overlay = document.querySelector('#overlay');
    const statusText = document.querySelector('#status-text');
    const startBtn = document.querySelector('#start-btn');

    // Mở khóa Audio/Video bằng thao tác tay
    startBtn.addEventListener('click', () => {
      video.play().then(() => {
        video.pause(); // Kích hoạt sẵn quyền audio/video
        startBtn.style.display = 'none';
        statusText.innerText = 'Hướng camera về phía trang báo...';
        overlay.style.pointerEvents = 'none'; // Cho phép tương tác xuyên qua overlay
      });
    });

    // Khi nhận diện đúng ảnh báo
    targetEntity.addEventListener("targetFound", () => {
      overlay.style.display = "none";
      video.muted = false; // Bật tiếng nếu cần
      video.play();
    });

    // Khi mất hình ảnh nhận diện
    targetEntity.addEventListener("targetLost", () => {
      overlay.style.display = "flex";
      statusText.innerText = 'Hướng camera về phía trang báo...';
      video.pause();
    });
  </script>

</body>
</html>
